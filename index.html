<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Notes</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#252525;background:#f7f6f2;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1200px;margin:auto;background:#fff;border-left:1px solid #e8e6df;border-right:1px solid #e8e6df}
aside{padding:24px 16px;background:#faf9f6;border-right:1px solid #e8e6df;min-width:0}.brand{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:750;color:#69685f;margin:0 8px 22px}
.search{width:100%;border:1px solid #e5e2d9;background:#fff;border-radius:8px;padding:11px 12px;outline-offset:2px}.new{margin:10px 0 24px;width:100%;border:0;background:#262822;color:#fff;border-radius:8px;padding:11px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8a887e;padding:0 8px}.notes{display:grid;gap:5px;margin-top:10px}.note{border:1px solid transparent;background:transparent;text-align:left;border-radius:8px;padding:12px;color:#282923;min-width:0}.note[aria-current=true]{background:#eeede7;border-color:#e2e0d7}.note strong,.note small,.note span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note strong{font-size:13px}.note small{font-size:11px;color:#8a887e;margin-top:6px}.note span{font-size:12px;color:#77766e;margin-top:5px}.hint{font-size:11px;line-height:1.9;color:#96948a;margin:24px 8px}
main{min-width:0;padding:24px clamp(18px,5vw,64px);display:flex;flex-direction:column;min-height:100vh}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #eeece6;padding-bottom:16px;color:#8a887e;font-size:12px}.actions{display:flex;gap:8px}.btn{border:1px solid #e5e2d9;background:white;border-radius:7px;padding:8px 12px;font-size:12px;color:#33352e}.btn:hover{background:#f4f3ee}.danger{color:#ad4c43}.title{border:0;outline:none;background:transparent;font-size:clamp(26px,4vw,36px);font-weight:650;letter-spacing:-.045em;color:#252620;width:100%;padding:28px 0 10px}.edited{font-size:12px;color:#99978e;margin-bottom:18px}.editor{flex:1;min-height:300px;resize:vertical;border:0;outline:none;background:transparent;color:#34352f;font:14px/1.9 ui-monospace,SFMono-Regular,Consolas,monospace;padding:4px 0 24px}.preview{flex:1;min-height:300px;line-height:1.85;overflow-wrap:anywhere;padding:4px 0 24px}.preview h1,.preview h2,.preview h3{line-height:1.3}.preview blockquote{border-left:3px solid #ddd9ce;padding-left:14px;color:#777}.preview code{background:#f1f0ea;padding:2px 4px;border-radius:3px}.preview pre{background:#f1f0ea;padding:12px;border-radius:7px;overflow:auto}.preview ul,.preview ol{padding-left:24px}.footer{border-top:1px solid #eeece6;padding-top:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#929087;font-size:12px}.empty{padding:12px 8px;color:#929087;font-size:12px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #817b66;outline-offset:2px}
@media(max-width:640px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid #e8e6df;padding:14px}.brand{margin-bottom:12px}.sidehead{display:flex;gap:8px}.sidehead .search{flex:1;min-width:0}.new{width:auto;margin:0 0 12px;padding:10px 12px}.notes{grid-template-columns:repeat(2,minmax(0,1fr));max-height:145px;overflow:auto}.note{padding:9px}.hint{display:none}main{min-height:65vh;padding:16px}.editor,.preview{min-height:250px}}
</style>
</head>
<body>
<div class="app">
<aside aria-label="Notes sidebar">
<p class="brand">Quiet Notes</p>
<div class="sidehead"><input id="search" class="search" type="search" placeholder="⌕ Search notes…" aria-label="Search notes"><button id="create" class="new" type="button">＋ New</button></div>
<div class="label">Your notes <span id="total"></span></div>
<nav id="notes" class="notes" aria-label="Your notes"></nav><div id="list-empty" class="empty" hidden>No notes found.</div>
<div class="hint">↑ ↓ Navigate<br>Enter Open · Ctrl/⌘ N New<br>Ctrl/⌘ S Save</div>
</aside>
<main aria-label="Note editor">
<div class="toolbar"><span id="status" role="status" aria-live="polite">Ready to write</span><div class="actions"><button id="toggle" class="btn" type="button" aria-pressed="false">Preview</button><button id="delete" class="btn danger" type="button">Delete</button></div></div>
<input id="title" class="title" maxlength="160" placeholder="Untitled note" aria-label="Note title">
<div id="edited" class="edited">A quiet place for your thoughts.</div>
<textarea id="editor" class="editor" aria-label="Markdown editor" spellcheck="true" placeholder="Start writing in Markdown…"></textarea>
<article id="preview" class="preview" aria-label="Rendered Markdown preview" hidden></article>
<div class="footer"><span id="count">0 words · 0 characters</span><span id="save-status" role="status" aria-live="polite">Saved locally</span></div>
</main>
</div>
<script>
(() => {
const $=id=>document.getElementById(id), list=$('notes'), search=$('search'), title=$('title'), editor=$('editor'), preview=$('preview');
const KEY='quiet-notes-v1'; let notes=[],active=null,filter='',showPreview=false,timer=null;
const now=()=>new Date().toISOString();
const fmt=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>notes.find(n=>n.id===active)||null;
const label=n=>n.title.trim()||'Untitled note';
const excerpt=n=>n.body.replace(/[#>*_`~\-[\]()]/g,'').replace(/\s+/g,' ').trim()||'Empty note';
function persist(){try{localStorage.setItem(KEY,JSON.stringify({notes,active}));$('save-status').textContent='Saved locally';}catch(e){$('save-status').textContent='Could not save locally';}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.notes)){notes=v.notes;active=v.active;}}catch(e){}if(!notes.length){const t=now();notes=[{id:'welcome',title:'Welcome to Quiet Notes',body:'# Your space to think\n\nA simple place for ideas, plans, and everything in between.\n\n## Markdown, naturally\n\nWrite **bold ideas**, *emphasize a thought*, or make a list:\n\n- Capture an idea\n- Make a plan\n- Keep learning\n\n> Great things start with a small note.\n\nYour notes are saved in this browser using local storage.',created:t,updated:t}];active=notes[0].id;persist();}}
function renderList(){const arr=notes.filter(n=>(n.title+' '+n.body).toLowerCase().includes(filter.toLowerCase())).sort((a,b)=>b.updated.localeCompare(a.updated));list.innerHTML='';for(const n of arr){const b=document.createElement('button');b.type='button';b.className='note';b.dataset.id=n.id;b.setAttribute('aria-current',String(n.id===active));b.innerHTML='<strong>'+esc(label(n))+'</strong><small>'+esc(fmt(n.updated))+'</small><span>'+esc(excerpt(n).slice(0,55))+'</span>';b.addEventListener('click',()=>select(n.id));list.appendChild(b);}$('total').textContent='('+notes.length+')';$('list-empty').hidden=arr.length>0;}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');}
function markdown(src){const blocks=[];src=src.replace(/```([^\n]*)\n([\s\S]*?)```/g,(m,l,c)=>{blocks.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');return '\n@@B'+(blocks.length-1)+'@@\n';});let out=[],ul=false,ol=false,quote=false;function close(){if(ul){out.push('</ul>');ul=false;}if(ol){out.push('</ol>');ol=false;}if(quote){out.push('</blockquote>');quote=false;}}for(const line of src.split('\n')){let m;if((m=line.match(/^@@B(\d+)@@$/))){close();out.push(blocks[+m[1]]);continue;}if(!line.trim()){close();continue;}if((m=line.match(/^(#{1,3})\s+(.+)$/))){close();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');continue;}if(/^\s*([-*_])\1\1+\s*$/.test(line)){close();out.push('<hr>');continue;}if((m=line.match(/^\s*>\s?(.*)$/))){if(!quote){close();out.push('<blockquote>');quote=true;}out.push('<p>'+inline(m[1])+'</p>');continue;}if((m=line.match(/^\s*[-*+]\s+(.+)$/))){if(ol){out.push('</ol>');ol=false;}if(quote){out.push('</blockquote>');quote=false;}if(!ul){out.push('<ul>');ul=true;}out.push('<li>'+inline(m[1])+'</li>');continue;}if((m=line.match(/^\s*\d+\.\s+(.+)$/))){if(ul){out.push('</ul>');ul=false;}if(quote){out.push('</blockquote>');quote=false;}if(!ol){out.push('<ol>');ol=true;}out.push('<li>'+inline(m[1])+'</li>');continue;}close();out.push('<p>'+inline(line)+'</p>');}close();return out.join('\n');}
function stats(){const s=editor.value;$('count').textContent=(s.trim()?s.trim().split(/\s+/).length:0)+' words · '+s.length+' characters';}
function draw(){const n=current();preview.innerHTML=n?markdown(n.body):'';}
function sync(){const n=current();title.value=n?n.title:'';editor.value=n?n.body:'';$('edited').textContent=n?'Last edited '+fmt(n.updated):'Create a note to start writing.';$('status').textContent=n?'Editing':'No note selected';stats();draw();}
function flush(){if(timer){clearTimeout(timer);timer=null;}const n=current();if(!n)return;n.title=title.value;n.body=editor.value;n.updated=now();persist();$('edited').textContent='Last edited '+fmt(n.updated);renderList();}
function schedule(){const n=current();if(!n)return;n.title=title.value;n.body=editor.value;n.updated=now();stats();if(showPreview)draw();$('edited').textContent='Last edited '+fmt(n.updated);$('save-status').textContent='Saving…';clearTimeout(timer);timer=setTimeout(()=>{timer=null;persist();renderList();},300);}
function select(id){flush();active=id;showPreview=false;preview.hidden=true;editor.hidden=false;$('toggle').textContent='Preview';$('toggle').setAttribute('aria-pressed','false');sync();renderList();}
function create(){flush();const t=now(),n={id:'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:'',body:'',created:t,updated:t};notes.unshift(n);active=n.id;filter='';search.value='';showPreview=false;preview.hidden=true;editor.hidden=false;$('toggle').textContent='Preview';persist();sync();renderList();title.focus();}
function remove(){const n=current();if(!n)return;if(!confirm('Delete “'+label(n)+'”? This cannot be undone.'))return;notes=notes.filter(x=>x.id!==n.id);active=notes.length?notes[0].id:null;persist();sync();renderList();}
search.addEventListener('input',()=>{filter=search.value;renderList();});$('create').addEventListener('click',create);$('delete').addEventListener('click',remove);title.addEventListener('input',schedule);editor.addEventListener('input',schedule);
$('toggle').addEventListener('click',()=>{flush();showPreview=!showPreview;preview.hidden=!showPreview;editor.hidden=showPreview;$('toggle').textContent=showPreview?'Edit':'Preview';$('toggle').setAttribute('aria-pressed',String(showPreview));if(showPreview){draw();$('status').textContent='Markdown preview';}else{$('status').textContent='Editing';editor.focus();}});
document.addEventListener('keydown',e=>{if(!document.querySelector('.app').contains(document.activeElement))return;const mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();create();}else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();flush();$('save-status').textContent='Saved locally';}else if(e.key==='Escape'&&document.activeElement===search){search.value='';filter='';renderList();}else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&document.activeElement.closest('#notes')){const items=[...list.querySelectorAll('button')];if(!items.length)return;e.preventDefault();let i=items.indexOf(document.activeElement);i=e.key==='ArrowDown'?Math.min(items.length-1,i+1):Math.max(0,i-1);items[i].focus();}});
window.addEventListener('beforeunload',flush);load();renderList();sync();
})();
</script>
</body>
</html>
