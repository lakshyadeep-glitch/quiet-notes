<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quiet Notes — your thinking space</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#242620;background:#f4f3ef;--bg:#f4f3ef;--panel:#fff;--side:#f9f8f5;--text:#242620;--muted:#85867c;--line:#e7e6df;--soft:#eeeee7;--accent:#3b5947;--accentText:#fff;--danger:#b54c45;--shadow:0 10px 35px #2426200a}
:root.dark{color-scheme:dark;--bg:#151714;--panel:#1c1f1b;--side:#191c18;--text:#e9e9e1;--muted:#a1a397;--line:#30342e;--soft:#292d27;--accent:#b4d2b9;--accentText:#19221b;--danger:#ff938a;--shadow:0 10px 35px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1500px;min-height:100vh;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr);background:var(--panel);border-inline:1px solid var(--line)}
aside{background:var(--side);border-right:1px solid var(--line);padding:22px 16px;min-width:0;display:flex;flex-direction:column;gap:16px}.brandrow{display:flex;align-items:center;gap:10px;padding:2px 7px 8px}.logo{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:var(--accent);color:var(--accentText);font-weight:800}.brand{font-size:14px;font-weight:800;letter-spacing:.02em}.tagline{font-size:11px;color:var(--muted);margin-top:2px}.searchwrap{position:relative}.searchwrap span{position:absolute;left:12px;top:10px;color:var(--muted)}.search{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);outline-offset:2px}.primary{border:0;background:var(--accent);color:var(--accentText);padding:11px 13px;border-radius:10px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px}.primary:hover{filter:brightness(.96)}.sidehead{display:flex;align-items:center;justify-content:space-between;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);padding:2px 7px}.sidehead button{border:0;background:transparent;color:var(--muted);font-size:11px;text-transform:none;letter-spacing:0}.filters{display:flex;gap:6px}.filter{border:1px solid transparent;border-radius:8px;padding:7px 9px;background:transparent;color:var(--muted);font-size:12px}.filter.active{background:var(--soft);border-color:var(--line);color:var(--text)}.notes{display:grid;gap:5px;overflow:auto;max-height:calc(100vh - 300px)}.note{position:relative;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:12px;min-width:0}.note:hover{background:var(--soft)}.note[aria-current=true]{background:var(--soft);border-color:var(--line)}.note strong,.note small,.note .excerpt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note strong{font-size:13px;font-weight:650;padding-right:18px}.note small{font-size:10px;color:var(--muted);margin-top:6px}.excerpt{font-size:12px;color:var(--muted);margin-top:6px}.pinmark{position:absolute;right:11px;top:11px;color:var(--accent)}.empty{padding:18px 10px;color:var(--muted);font-size:12px;text-align:center}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding:14px 5px 0;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px}.sidebottom button{background:transparent;border:0;color:var(--muted);font-size:11px}
main{min-width:0;min-height:100vh;padding:25px clamp(18px,5vw,72px) 18px;display:flex;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:17px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#7baf83}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;font-size:12px}.btn:hover{background:var(--soft)}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:23px;flex-wrap:wrap}.date{font-size:11px;color:var(--muted)}.pinbtn{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.pinbtn.pinned{color:var(--accent)}.title{display:block;width:100%;border:0;outline:none;background:transparent;color:var(--text);font-size:clamp(27px,4vw,42px);font-weight:720;letter-spacing:-.045em;padding:12px 0 8px}.title::placeholder{color:var(--muted);opacity:.6}.editor{flex:1;width:100%;min-height:350px;resize:vertical;border:0;outline:none;background:transparent;color:var(--text);font:14px/1.95 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px 0 28px}.preview{flex:1;min-height:350px;line-height:1.85;overflow-wrap:anywhere;padding:10px 0 28px}.preview h1,.preview h2,.preview h3{line-height:1.25;letter-spacing:-.025em}.preview h1{font-size:2em}.preview h2{font-size:1.5em}.preview blockquote{border-left:3px solid var(--accent);padding-left:15px;color:var(--muted);margin-left:0}.preview code{background:var(--soft);padding:2px 5px;border-radius:5px;font-size:.9em}.preview pre{background:var(--soft);padding:15px;border-radius:10px;overflow:auto}.preview a{color:var(--accent)}.preview ul,.preview ol{padding-left:25px}.preview hr{border:0;border-top:1px solid var(--line);margin:22px 0}.preview img{max-width:100%}.footer{border-top:1px solid var(--line);padding-top:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px}.footright{display:flex;gap:14px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 15px;border-radius:10px;background:var(--text);color:var(--panel);font-size:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:700px){.app{grid-template-columns:1fr;border:0}aside{border-right:0;border-bottom:1px solid var(--line);padding:13px;gap:10px}.brandrow{padding-bottom:0}.notes{grid-template-columns:repeat(2,minmax(0,1fr));max-height:180px}.note{padding:9px}.sidebottom{display:none}main{min-height:65vh;padding:15px 17px}.editor,.preview{min-height:260px}.actions .btn{padding:7px 8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside aria-label="Notes sidebar">
  <div class="brandrow"><div class="logo">q.</div><div><div class="brand">Quiet Notes</div><div class="tagline">A little space to think clearly.</div></div></div>
  <div class="searchwrap"><span>⌕</span><input id="search" class="search" type="search" placeholder="Search your notes…" aria-label="Search notes"></div>
  <button id="create" class="primary" type="button">＋ &nbsp; Create a note <span style="opacity:.65;font-size:11px">⌘ N</span></button>
  <div class="sidehead"><span>Your library</span><span id="total">0 notes</span></div>
  <div class="filters" role="group" aria-label="Filter notes"><button class="filter active" data-filter="all">All notes</button><button class="filter" data-filter="pinned">★ Pinned</button></div>
  <nav id="notes" class="notes" aria-label="Your notes"></nav><div id="list-empty" class="empty" hidden>No notes match your search.</div>
  <div class="sidebottom"><span>Stored on this device</span><button id="exportAll" type="button">Export library ↗</button></div>
</aside>
<main aria-label="Note editor">
  <div class="toolbar"><div class="status"><span class="dot"></span><span id="status" role="status" aria-live="polite">Ready to write</span></div><div class="actions">
    <button id="toggle" class="btn" type="button" aria-pressed="false">◫ Preview</button>
    <button id="download" class="btn" type="button">↓ Markdown</button>
    <button id="theme" class="btn" type="button" aria-label="Toggle color theme">☾ Theme</button>
    <button id="delete" class="btn danger" type="button">Delete</button>
  </div></div>
  <div class="meta"><div id="edited" class="date">Your next idea can start here.</div><button id="pin" class="pinbtn" type="button">☆ Pin note</button></div>
  <input id="title" class="title" maxlength="160" placeholder="Untitled note" aria-label="Note title">
  <textarea id="editor" class="editor" aria-label="Markdown editor" spellcheck="true" placeholder="Start with a thought…&#10;&#10;Use Markdown to give your notes structure."></textarea>
  <article id="preview" class="preview" aria-label="Rendered Markdown preview" hidden></article>
  <div class="footer"><span id="count">0 words · 0 characters</span><div class="footright"><span id="save-status" role="status" aria-live="polite">All changes saved</span><span>Ctrl/⌘ S to save</span></div></div>
</main>
</div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),list=$('notes'),search=$('search'),title=$('title'),editor=$('editor'),preview=$('preview');
const KEY='quiet-notes-v2',THEME='quiet-notes-theme-v1';let notes=[],active=null,filter='all',showPreview=false,timer=null,toastTimer=null;
const now=()=>new Date().toISOString(),current=()=>notes.find(n=>n.id===active)||null,label=n=>n.title.trim()||'Untitled note';
const fmt=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const excerpt=n=>n.body.replace(/[#>*_`~\-[\]()]/g,'').replace(/\s+/g,' ').trim()||'A blank page, ready for an idea.';
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({notes,active}));$('save-status').textContent='All changes saved';}catch(e){$('save-status').textContent='Storage unavailable';toast('Could not save in this browser. Export your notes as a backup.');}}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.notes)){notes=v.notes.map(n=>({...n,pinned:!!n.pinned}));active=v.active;}}catch(e){}
if(!notes.length){let t=now();notes=[{id:'welcome',title:'Welcome to Quiet Notes',body:'# Make room for your thoughts\\n\\nA calm, lightweight place for ideas, plans, class notes, and everything in between.\\n\\n## A few things to try\\n\\n- **Create** a note for a new idea\\n- **Pin** the notes you use most\\n- Write in Markdown, then switch to **Preview**\\n- Export your library so you have a backup\\n\\n> Small notes can lead to big things.\\n\\nYour notes are stored locally in this browser on this device.',created:t,updated:t,pinned:true}];active='welcome';persist();}}
function renderList(){let q=search.value.toLowerCase();let arr=notes.filter(n=>(filter!=='pinned'||n.pinned)&&(n.title+' '+n.body).toLowerCase().includes(q)).sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||b.updated.localeCompare(a.updated));list.innerHTML='';
for(const n of arr){let b=document.createElement('button');b.type='button';b.className='note';b.dataset.id=n.id;b.setAttribute('aria-current',String(n.id===active));b.innerHTML=(n.pinned?'<span class="pinmark" aria-label="Pinned">★</span>':'')+'<strong>'+esc(label(n))+'</strong><small>'+esc(fmt(n.updated))+'</small><span class="excerpt">'+esc(excerpt(n).slice(0,65))+'</span>';b.addEventListener('click',()=>select(n.id));list.appendChild(b);}
$('total').textContent=notes.length+' '+(notes.length===1?'note':'notes');$('list-empty').hidden=arr.length>0;}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/~~(.+?)~~/g,'<del>$1</del>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');}
function markdown(src){let blocks=[];src=src.replace(/```([^\n]*)\n([\s\S]*?)```/g,(m,l,c)=>{blocks.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');return '\n@@B'+(blocks.length-1)+'@@\n';});let out=[],ul=false,ol=false,quote=false;function close(){if(ul){out.push('</ul>');ul=false}if(ol){out.push('</ol>');ol=false}if(quote){out.push('</blockquote>');quote=false}}
for(let line of src.split('\n')){let m;if((m=line.match(/^@@B(\d+)@@$/))){close();out.push(blocks[+m[1]]);continue}if(!line.trim()){close();continue}if((m=line.match(/^(#{1,3})\s+(.+)$/))){close();out.push('<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>');continue}if(/^\s*([-*_])\1\1+\s*$/.test(line)){close();out.push('<hr>');continue}if((m=line.match(/^\s*>\s?(.*)$/))){if(!quote){close();out.push('<blockquote>');quote=true}out.push('<p>'+inline(m[1])+'</p>');continue}if((m=line.match(/^\s*[-*+]\s+(.+)$/))){if(ol){out.push('</ol>');ol=false}if(quote){out.push('</blockquote>');quote=false}if(!ul){out.push('<ul>');ul=true}out.push('<li>'+inline(m[1])+'</li>');continue}if((m=line.match(/^\s*\d+\.\s+(.+)$/))){if(ul){out.push('</ul>');ul=false}if(quote){out.push('</blockquote>');quote=false}if(!ol){out.push('<ol>');ol=true}out.push('<li>'+inline(m[1])+'</li>');continue}close();out.push('<p>'+inline(line)+'</p>')}close();return out.join('\n');}
function stats(){let s=editor.value;$('count').textContent+(s.trim()?s.trim().split(/\s+/).length:0);$('count').textContent=(s.trim()?s.trim().split(/\s+/).length:0)+' words · '+s.length+' characters';}
function draw(){let n=current();preview.innerHTML=n?markdown(n.body):'<p class="date">Choose a note or create a new one.</p>';}
function sync(){let n=current();title.value=n?n.title:'';editor.value=n?n.body:'';$('edited').textContent=n?'Last edited '+fmt(n.updated):'Create a note to start writing.';$('status').textContent=n?'Editing note':'No note selected';$('delete').disabled=!n;$('download').disabled=!n;$('pin').disabled=!n;$('pin').textContent=n?(n.pinned?'★ Pinned — click to unpin':'☆ Pin note'):'☆ Pin note';$('pin').classList.toggle('pinned',!!(n&&n.pinned));stats();draw();}
function flush(){if(timer){clearTimeout(timer);timer=null}let n=current();if(!n)return;n.title=title.value;n.body=editor.value;n.updated=now();persist();$('edited').textContent='Last edited '+fmt(n.updated);renderList();}
function schedule(){let n=current();if(!n)return;n.title=title.value;n.body=editor.value;n.updated=now();stats();if(showPreview)draw();$('edited').textContent='Last edited '+fmt(n.updated);$('save-status').textContent='Saving…';clearTimeout(timer);timer=setTimeout(()=>{timer=null;persist();renderList()},350);}
function select(id){flush();active=id;showPreview=false;preview.hidden=true;editor.hidden=false;$('toggle').textContent='◫ Preview';$('toggle').setAttribute('aria-pressed','false');sync();renderList();}
function create(){flush();let t=now(),n={id:'n-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),title:'',body:'',created:t,updated:t,pinned:false};notes.unshift(n);active=n.id;search.value='';filter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));showPreview=false;preview.hidden=true;editor.hidden=false;persist();sync();renderList();title.focus();}
function remove(){let n=current();if(!n)return;if(!confirm('Delete “'+label(n)+'”? This cannot be undone.'))return;notes=notes.filter(x=>x.id!==n.id);active=notes.length?notes.sort((a,b)=>b.updated.localeCompare(a.updated))[0].id:null;persist();sync();renderList();toast('Note deleted');}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function safeName(s){return (s.trim()||'untitled-note').replace(/[^\w\- ]+/g,'').replace(/\s+/g,'-').slice(0,70)||'untitled-note';}
$('create').addEventListener('click',create);$('delete').addEventListener('click',remove);title.addEventListener('input',schedule);editor.addEventListener('input',schedule);search.addEventListener('input',renderList);
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderList()}));
$('toggle').addEventListener('click',()=>{flush();showPreview=!showPreview;preview.hidden=!showPreview;editor.hidden=showPreview;$('toggle').textContent=showPreview?'✎ Edit':'◫ Preview';$('toggle').setAttribute('aria-pressed',String(showPreview));if(showPreview){draw();$('status').textContent='Markdown preview'}else{$('status').textContent='Editing note';editor.focus()}});
$('pin').addEventListener('click',()=>{let n=current();if(!n)return;flush();n.pinned=!n.pinned;n.updated=now();persist();sync();renderList();toast(n.pinned?'Note pinned':'Note unpinned')});
$('download').addEventListener('click',()=>{flush();let n=current();if(n)downloadFile(safeName(label(n))+'.md','# '+label(n)+'\n\n'+n.body,'text/markdown;charset=utf-8')});
$('exportAll').addEventListener('click',()=>{flush();downloadFile('quiet-notes-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:2,exportedAt:now(),notes},null,2),'application/json');toast('Library backup exported')});
$('theme').addEventListener('click',()=>{document.documentElement.classList.toggle('dark');localStorage.setItem(THEME,document.documentElement.classList.contains('dark')?'dark':'light')});
try{if(localStorage.getItem(THEME)==='dark')document.documentElement.classList.add('dark')}catch(e){}
document.addEventListener('keydown',e=>{if(!document.querySelector('.app').contains(document.activeElement))return;let mod=e.ctrlKey||e.metaKey;if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();create()}else if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();flush();toast('Saved')}else if(e.key==='Escape'&&document.activeElement===search){search.value='';renderList()}else if((e.key==='ArrowDown'||e.key==='ArrowUp')&&document.activeElement.closest('#notes')){let items=[...list.querySelectorAll('button')];if(!items.length)return;e.preventDefault();let i=items.indexOf(document.activeElement);i=e.key==='ArrowDown'?Math.min(items.length-1,i+1):Math.max(0,i-1);items[i].focus()}});
window.addEventListener('beforeunload',flush);load();renderList();sync();
})();
</script>
</body>
</html>
